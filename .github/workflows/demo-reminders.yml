name: Demo reminders

# The actual 5-minute schedule lives on cron-job.org (a free external
# scheduler), not here — GitHub Actions' own `schedule` trigger was tried
# first but proved unreliable in practice (it never fired on its own even
# once in over an hour of waiting, a known quirk with GitHub deprioritizing
# cron runs, especially for newly-added schedules on free/public repos).
#
# This workflow is kept around purely as a manual trigger
# (workflow_dispatch) for debugging — e.g. to force an immediate check
# without waiting for the external scheduler's next tick.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call demo-reminders endpoint
        run: |
          # Strip any trailing slash from APP_URL so this works whether or
          # not it was entered with one — a stray "//" in the path makes
          # Vercel issue a redirect, and since curl here isn't told to
          # follow redirects (-L), a redirect would otherwise print its
          # stub body and exit 0, masquerading as a successful call that
          # never actually reached the route.
          APP_URL="${{ vars.APP_URL }}"
          APP_URL="${APP_URL%/}"
          curl -sS -L -X POST "$APP_URL/api/cron/demo-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail-with-body
