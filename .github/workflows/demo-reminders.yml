name: Demo reminders

# Vercel's free Hobby plan only runs cron jobs once a day, which is useless
# for a "30 minutes before" reminder — so this repo's own GitHub Actions
# schedule fills in instead, calling the app's /api/cron/demo-reminders
# endpoint every 5 minutes. GitHub's own scheduler isn't second-precise and
# can run a few minutes late, which is why that endpoint checks a window
# (25–40 minutes out) rather than an exact instant.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call demo-reminders endpoint
        run: |
          # Strip any trailing slash from APP_URL so this works whether or
          # not it was entered with one — a stray "//" in the path makes
          # Vercel issue a redirect, and since curl here isn't told to
          # follow redirects (-L), a redirect would otherwise print its
          # stub body and exit 0, masquerading as a successful call that
          # never actually reached the route.
          APP_URL="${{ vars.APP_URL }}"
          APP_URL="${APP_URL%/}"
          curl -sS -L -X POST "$APP_URL/api/cron/demo-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail-with-body
